name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step on purpose: scripts/detect.mjs and every script
      # alongside it are Node-stdlib-only by design (CLAUDE.md), so there is
      # nothing for `npm install` to do and no package.json to run it against.

      - name: Test suite (node --test)
        run: node --test

      - name: Lint (frontmatter, XML, rule sources, config drift, em-dash)
        run: node scripts/lint.mjs

      - name: Eval (informational, not gating)
        run: node scripts/eval.mjs
        # scripts/eval.mjs always exits 0 by design: a low pass rate is a
        # real, disclosed finding about detection recall (see
        # docs/decisions/0010 and 0012), not something CI should hard-fail
        # a PR over the way a test-suite regression should. Its output
        # still shows up in the run log either way.
